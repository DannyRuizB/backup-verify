name: ci

# Eight stages, in order of how much they prove:
#   lint         - the scripts parse, shellcheck is happy, the units pass
#   e2e          - a real source (Postgres 17/16, MySQL 8.4, a file tree; plain
#                  and encrypted) is seeded, backed up, DESTROYED, and restored
#   negative     - every way a backup lies is caught on EVERY engine, and a
#                  good one still passes
#   offsite      - the fire drill: push, lose everything local, pull, restore -
#                  and every measured way an off-site copy lies is caught, over
#                  a real sshd and over a plain directory
#   pitr         - the point-in-time drill: base backup + WAL archive, disaster
#                  committed AFTER the mark, source destroyed - and the named
#                  instant comes back exactly, with every measured archive lie
#                  caught; plain and with the whole chain encrypted through age
#   pitr-offsite - the strongest disaster simulated here: mark, push, then
#                  lose the MACHINE (source, archive, manifests) - the remote
#                  alone brings the named instant back, and every measured way
#                  an off-site WAL archive lies is caught, over both remotes,
#                  plain and encrypted end to end
#   binlog       - the MySQL point-in-time drill: anchored dump + archived
#                  binlogs, disaster committed AFTER the mark, source
#                  destroyed - and the named instant comes back exactly,
#                  with arrival proven by CONTENT, because a replay that
#                  never arrives exits 0 in silence (measured); plain,
#                  with the whole archive encrypted through age (a raw
#                  binlog greps your rows back in clear - measured), under
#                  GTID (where a replay can exit 0 having applied NOTHING -
#                  measured), and both at once
#   binlog-offsite - the same instant pushed to a remote, the MACHINE lost,
#                  and the remote alone bringing it back - where even
#                  truncation is shapeless (a binlog cut at an event
#                  boundary decodes clean - measured), so the inventory
#                  hash carries everything, over both transports, plain
#                  and as ciphertext the remote never gets a key for
on:
  push:
    branches: [main]
  pull_request:
  # A backup tool that only works on the day you wrote it is not a backup tool.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck + bats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Bash syntax
        run: for f in backup.sh verify.sh offsite.sh pitr.sh lib/*.sh test/*.sh; do bash -n "$f"; done

      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck >/dev/null
          shellcheck -x backup.sh verify.sh offsite.sh pitr.sh binlog.sh lib/*.sh test/*.sh

      - name: Unit tests (bats)
        run: |
          sudo apt-get install -y bats age >/dev/null
          bats test/

  e2e:
    name: e2e ${{ matrix.target.image }} ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Two promises proven at once. A backup format is a compatibility
      # promise, so Postgres runs across versions and MySQL alongside them -
      # every engine survives the same destruction test. And encryption must
      # not change the promise, so the same cycle also runs through age.
      matrix:
        target:
          - { engine: postgres, image: 'postgres:17-alpine' }
          - { engine: postgres, image: 'postgres:16-alpine' }
          - { engine: mysql, image: 'mysql:8.4' }
          # No image at all: the files engine restores into a scratch
          # directory. Same destruction test, no Docker involved.
          - { engine: files, image: 'scratch-dir' }
          # A single-file database: same destruction test, no Docker, the
          # instance is a scratch .db file.
          - { engine: sqlite, image: 'scratch-db' }
        mode: ['', '--encrypted']
    steps:
      - uses: actions/checkout@v5
      - name: Install sqlite3
        if: matrix.target.engine == 'sqlite'
        run: sudo apt-get update -qq && sudo apt-get install -y sqlite3 >/dev/null
      - name: Install age
        if: matrix.mode == '--encrypted'
        run: sudo apt-get update -qq && sudo apt-get install -y age >/dev/null
      - name: e2e
        env:
          BV_IMAGE: ${{ matrix.target.image }}
        run: ./test/e2e.sh --engine ${{ matrix.target.engine }} ${{ matrix.mode }}

  negative:
    name: Every failure mode is caught (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Every engine, because each contributes its own measured disaster to
      # case 6: pg_dump -t on Postgres, mysqldump's routine-dropping DEFAULT
      # invocation on MySQL, the dotfile-dropping `tar czf backup.tgz *` on
      # files, and a table-scoped `.dump customers orders` on sqlite (which
      # drops the index, both views and the trigger while keeping every row).
      matrix:
        engine: [postgres, mysql, files, sqlite]
    steps:
      - uses: actions/checkout@v5
      - name: Install sqlite3
        if: matrix.engine == 'sqlite'
        run: sudo apt-get update -qq && sudo apt-get install -y sqlite3 >/dev/null
      # Not optional: the encryption cases FAIL the suite if age is missing,
      # rather than skipping quietly and reporting green.
      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y age >/dev/null
      - name: negative cases
        run: ./test/negative.sh --engine ${{ matrix.engine }}

  offsite:
    name: off-site fire drill (${{ matrix.remote }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The same protocol over both remote kinds: a real sshd in Docker (which
      # also hosts the disk-full case on a 256K tmpfs), and a plain directory,
      # the mounted-NAS case. age is required, not optional - the encrypted
      # chain must run, not skip.
      matrix:
        remote: [ssh, dir]
    steps:
      - uses: actions/checkout@v5
      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y age >/dev/null
      - name: fire drill + every measured off-site lie
        run: ./test/offsite.sh --remote-kind ${{ matrix.remote }}

  pitr:
    name: PITR fire drill (${{ matrix.image }} ${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # A recovery is a compatibility promise too: base backups are bytes from
      # ONE major version, so the drill runs on both supported majors - and
      # encryption must not change the promise, so the same drill also runs
      # with every segment leaving the server as age ciphertext.
      matrix:
        image: ['postgres:17-alpine', 'postgres:16-alpine']
        mode: ['', '--encrypted']
    steps:
      - uses: actions/checkout@v5
      # The static RELEASE build, not apt: this binary rides INTO alpine
      # containers, and Ubuntu's packaged age does not run there (the
      # harness's preflight caught exactly that on this job's first run).
      - name: Install age (static release build)
        if: matrix.mode == '--encrypted'
        run: |
          curl -sL https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz | tar -xz
          sudo install age/age age/age-keygen /usr/local/bin/
      - name: fire drill + every measured WAL archive lie
        env:
          BV_IMAGE: ${{ matrix.image }}
        run: ./test/pitr.sh ${{ matrix.mode }}

  pitr-offsite:
    name: PITR off-site fire drill (${{ matrix.remote }} ${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Same protocol over both transports on purpose: the harness caught a
      # recovery that worked over ssh and died over a directory remote with
      # the SAME bytes (a copied 0600 mode vs a redirect's 0644). And the
      # encrypted chain must survive the same fire untouched.
      matrix:
        remote: [ssh, dir]
        mode: ['', '--encrypted']
    steps:
      - uses: actions/checkout@v5
      # Static release build, same reason as the pitr job: apt's age cannot
      # run inside the alpine containers the drill mounts it into.
      - name: Install age (static release build)
        if: matrix.mode == '--encrypted'
        run: |
          curl -sL https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz | tar -xz
          sudo install age/age age/age-keygen /usr/local/bin/
      - name: fire drill + every measured off-site WAL archive lie
        run: ./test/pitr-offsite.sh --remote-kind ${{ matrix.remote }} ${{ matrix.mode }}

  binlog:
    name: MySQL binlog fire drill (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Encrypted re-runs the whole drill through age, plus the two
      # encrypted-only refusals (no key, wrong key). GTID re-runs it against
      # a gtid_mode=ON source - detected, never flagged - plus the GTID-only
      # gates; and the two compose, because neither may change the promise.
      matrix:
        mode: ['', '--encrypted', '--gtid', '--gtid --encrypted']
    steps:
      - uses: actions/checkout@v5
      # Static release build, same reason as the pitr job: age rides into the
      # replay container, and a dynamically linked age does not run there.
      - name: Install age (static release build)
        if: contains(matrix.mode, '--encrypted')
        run: |
          curl -sL https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz | tar -xz
          sudo install age/age age/age-keygen /usr/local/bin/
      # The drill extracts mysqlbinlog from the official client RPM itself -
      # the mysql image does not ship it (measured), and only the
      # exact-version official build is an honest replay tool.
      - name: fire drill + every measured binlog lie
        run: ./test/binlog.sh ${{ matrix.mode }}

  binlog-offsite:
    name: MySQL binlog off-site fire drill (${{ matrix.remote }} ${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Both transports, plain and with the chain as ciphertext the remote
      # never gets a key for.
      matrix:
        remote: [ssh, dir]
        mode: ['', '--encrypted']
    steps:
      - uses: actions/checkout@v5
      - name: Install age (static release build)
        if: matrix.mode == '--encrypted'
        run: |
          curl -sL https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz | tar -xz
          sudo install age/age age/age-keygen /usr/local/bin/
      - name: fire drill + every measured off-site binlog lie
        run: ./test/binlog-offsite.sh --remote-kind ${{ matrix.remote }} ${{ matrix.mode }}
