name: ci

# Four stages, in order of how much they prove:
#   lint      - the scripts parse, shellcheck is happy, the units pass
#   e2e       - a real source (Postgres 17/16, MySQL 8.4, a file tree; plain
#               and encrypted) is seeded, backed up, DESTROYED, and restored
#   negative  - every way a backup lies is caught on EVERY engine, and a good
#               one still passes
#   offsite   - the fire drill: push, lose everything local, pull, restore -
#               and every measured way an off-site copy lies is caught, over
#               a real sshd and over a plain directory
on:
  push:
    branches: [main]
  pull_request:
  # A backup tool that only works on the day you wrote it is not a backup tool.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck + bats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Bash syntax
        run: for f in backup.sh verify.sh offsite.sh lib/*.sh test/*.sh; do bash -n "$f"; done

      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck >/dev/null
          shellcheck -x backup.sh verify.sh offsite.sh lib/*.sh test/*.sh

      - name: Unit tests (bats)
        run: |
          sudo apt-get install -y bats age >/dev/null
          bats test/

  e2e:
    name: e2e ${{ matrix.target.image }} ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Two promises proven at once. A backup format is a compatibility
      # promise, so Postgres runs across versions and MySQL alongside them -
      # every engine survives the same destruction test. And encryption must
      # not change the promise, so the same cycle also runs through age.
      matrix:
        target:
          - { engine: postgres, image: 'postgres:17-alpine' }
          - { engine: postgres, image: 'postgres:16-alpine' }
          - { engine: mysql, image: 'mysql:8.4' }
          # No image at all: the files engine restores into a scratch
          # directory. Same destruction test, no Docker involved.
          - { engine: files, image: 'scratch-dir' }
        mode: ['', '--encrypted']
    steps:
      - uses: actions/checkout@v5
      - name: Install age
        if: matrix.mode == '--encrypted'
        run: sudo apt-get update -qq && sudo apt-get install -y age >/dev/null
      - name: e2e
        env:
          BV_IMAGE: ${{ matrix.target.image }}
        run: ./test/e2e.sh --engine ${{ matrix.target.engine }} ${{ matrix.mode }}

  negative:
    name: Every failure mode is caught (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Every engine, because each contributes its own measured disaster to
      # case 6: pg_dump -t on Postgres, mysqldump's routine-dropping DEFAULT
      # invocation on MySQL, and the dotfile-dropping `tar czf backup.tgz *`
      # on files.
      matrix:
        engine: [postgres, mysql, files]
    steps:
      - uses: actions/checkout@v5
      # Not optional: the encryption cases FAIL the suite if age is missing,
      # rather than skipping quietly and reporting green.
      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y age >/dev/null
      - name: negative cases
        run: ./test/negative.sh --engine ${{ matrix.engine }}

  offsite:
    name: off-site fire drill (${{ matrix.remote }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The same protocol over both remote kinds: a real sshd in Docker (which
      # also hosts the disk-full case on a 256K tmpfs), and a plain directory,
      # the mounted-NAS case. age is required, not optional - the encrypted
      # chain must run, not skip.
      matrix:
        remote: [ssh, dir]
    steps:
      - uses: actions/checkout@v5
      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y age >/dev/null
      - name: fire drill + every measured off-site lie
        run: ./test/offsite.sh --remote-kind ${{ matrix.remote }}
